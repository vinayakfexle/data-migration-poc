name: Sequential Jobs with Timeout Handling

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  job1:
    name: Job 1 - Quick Task
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Job 1 - Quick execution
        run: |
          echo "Job 1: Starting quick task"
          sleep 10
          echo "Job 1: Completed successfully"

  job2:
    name: Job 2 - Long Running Task (Will Timeout)
    needs: job1
    runs-on: ubuntu-latest
    timeout-minutes: 1
    # continue-on-error ensures that even if this job times out or is cancelled,
    # the workflow will proceed to the next job instead of stopping
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Job 2 - Task that exceeds timeout
        run: |
          echo "Job 2: Starting long-running task"
          echo "This task will take more than 1 minute to complete"
          
          # Simulate a long-running process (e.g., data migration, heavy computation)
          for i in {1..120}; do
            echo "Processing step $i/120 - $(date)"
            sleep 1
          done
          
          echo "Job 2: Completed successfully"

  job3:
    name: Job 3 - Final Task
    needs: job2
    runs-on: ubuntu-latest
    timeout-minutes: 1
    # continue-on-error ensures this job runs even if job2 timed out or was cancelled
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Check previous job status
        run: |
          echo "Job 3: Running regardless of Job 2 status"
          echo "This step will NOT be skipped even if Job 2 timed out or was cancelled"
          sleep 15
          echo "Job 3: Completed successfully"

